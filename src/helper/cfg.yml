#--------------------------------------------------------------------------------------
# プロンプトに使用するパラメータ
len_src_to_summary: 4000
similarity_top_k: 3
streaming: true
response_mode: compact

# RAG で取得可能なファイル形式 (word における旧式の拡張子 .doc は読み取り不可)
list_file_ext:
  - .pdf
  - .txt
  - .docx
