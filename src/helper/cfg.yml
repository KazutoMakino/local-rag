#######################################################################################
# # パス
#--------------------------------------------------------------------------------------
# データの所在（`{repo.}/data/` からの相対パスを推奨）
dir_data: dummy/kokkai
# ファイル更新を確認するための json `{repo.}/.cache/` からの相対パスを推奨）
file_tracker: state_tracker.json

#######################################################################################
# # 最終的な RAG 用の設定値
#--------------------------------------------------------------------------------------
# 比較対象となるベクトル DB のテーブル名称
text_table: text_table

# プロンプト
query_str: |
  日本政府はベンチャーやスタートアップに何を望んでいますか？

# テンプレート
text_qa_template: |
  あなたは熟練したデータアナリストです。
  提供された資料を基に、質問に対して結論から簡潔に回答してください。

  制約事項:
  1. 回答はあなたの言葉で要約し、資料からの直接的な長文引用は避けてください。
  2. 根拠となる情報は、文末に「参照: [ファイルパス]」という形式で明記してください。
  3. 以前の質問や回答は一切繰り返さないでください。
  4. 回答が終わったらそれ以上は何も生成しないでください。

  ---
  資料情報: {context_str}
  質問: {query_str}
  回答:

#######################################################################################
# # サマリー用の設定値
#--------------------------------------------------------------------------------------
# 比較対象となるベクトル DB のテーブル名称
summary_table: summary_table

# summary 作成用のプロンプト
summary_prompt: |
  以下のテキストを分析し、指定されたフォーマットで出力してください。
  余計な説明は一切不要です。名簿は無視してください。

  [SUMMARY]
  100文字程度の概要を記述

  [KEYWORDS]
  キーワード1, キーワード2, キーワード3

  [TYPE]
  文書の種類

  [DATE]
  日付（不明なら不明）

  【テキスト】
  {text}

