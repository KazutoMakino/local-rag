[project]
name = "local-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "devtools>=0.12.2",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.10.2",
    "isort>=8.0.1",
    "jupyterlab>=4.4.0",
    "lancedb>=0.30.2",
    "llama-cpp-python>=0.3.20",
    "llama-index>=0.14.20",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-llama-cpp>=0.6.0",
    "llama-index-vector-stores-lancedb>=0.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "requests>=2.33.1",
    "ruff>=0.11.6",
    "tqdm>=4.67.3",
    "ty>=0.0.1a7",
    "untangle>=1.2.1",
    "uv>=0.6.14",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
]

[tool.ruff]
lint.select = [
    "I", # isort
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle warnings
    "D", # pydocstyle
]
lint.ignore = []
lint.extend-ignore = [
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # undocumented-magic-method
    "D107", # undocumented-public-init
    "D205", # blank-line-after-summary
    "D415", # ends-in-punctuation
    "E501" # Line too long
]
lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_column_numbers = true
show_error_context = true
strict = false
warn_redundant_casts = true
disable_error_code = [
    "no-redef",
]

[[tool.mypy.overrides]]
module = [
    'lightgbm',
    'optuna',
    'polars',
    'pytz',
    'psutil',
    'requests/*',
    'tensorflow',
    'torch',
    'transformers',
    'xgboost',
]
ignore_missing_imports = true
ignore_errors = true
